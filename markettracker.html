/* Композиция: тёмно-зелёная колонка навигации слева, молочная рабочая область с крупными заголовками
   и компактными рабочими элементами; превью креативов оформлены как макет на монтажном столе (метки обреза).
   Единая светлая тема по брендовой палитре — выбрана намеренно. */
:root{
  color-scheme: light;
  --milk:#F5F5ED;        /* основной фон */
  --forest:#173C32;      /* текст и тёмные поверхности */
  --sage:#AFC5AF;        /* вторичный зелёный */
  --lime:#D5F279;        /* главные действия, активные элементы */
  --mist:#E7EDE5;        /* спокойный фон */
  --paper:#FFFFFF;       /* рабочие поверхности: таблицы, поля */
  --ink-2:#3F5E55;       /* вторичный текст */
  --ink-3:#5E7A71;       /* подписи */
  --line:#D5DDD2;        /* тонкие разделители */
  --line-strong:#B9C7B8;
  --forest-2:#21493E;    /* поверхности на тёмном */
  --on-forest:#E7EDE5;
  --on-forest-2:#A9C0B3;
  --err:#A8352A; --err-soft:#F6E1DC;
  --warn:#8A5A00; --warn-soft:#F6E9C6;
  --ok:#2E6B3F; --ok-soft:#DCEBD7;
  --display:"Unbounded", "Arial Black", Arial, sans-serif;
  --ui:"Onest", "Segoe UI", Arial, sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{background:var(--milk)}
body{color:var(--forest);font-family:var(--ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--forest);outline-offset:2px;border-radius:4px}
.num{font-variant-numeric:tabular-nums}

/* Демо-панель */
.demo{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:7px 20px;background:var(--forest-2);color:var(--on-forest);font-size:12.5px;border-bottom:1px solid #0f2a23}
.demo .tag{background:var(--lime);color:var(--forest);border-radius:999px;padding:2px 10px;font-weight:600}
.demo label{display:flex;gap:6px;align-items:center;flex-wrap:wrap;min-width:0;max-width:100%}
.demo select,.demo button{background:var(--forest);color:var(--on-forest);border:1px solid #3d6457;border-radius:var(--r-s);padding:3px 8px;max-width:min(100%,calc(100vw - 40px))}
.demo button:hover,.demo select:hover{border-color:var(--sage)}
.demo .hint{color:var(--on-forest-2)}

/* Каркас */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100vh - 38px);background:linear-gradient(to right,var(--forest) 236px,var(--milk) 236px)}
@media (max-width:980px){.app{background:var(--milk)}}
.rail{background:var(--forest);color:var(--on-forest);padding:22px 14px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:calc(100vh - 38px);overflow-y:auto}
.mark{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark i{width:22px;height:22px;border-radius:6px;background:var(--lime);display:block;position:relative;flex:none}
.mark i::after{content:"";position:absolute;inset:6px 6px 6px 6px;border:2px solid var(--forest);border-radius:2px}
.mark b{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:-.01em}
.mark small{display:block;font-weight:400;font-family:var(--ui);font-size:12px;color:var(--on-forest-2);margin-top:2px}
.navgroup{display:flex;flex-direction:column;gap:2px}
.navgroup h4{font-size:12px;font-weight:500;color:var(--on-forest-2);margin:0 0 6px;padding:0 10px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-s);color:var(--on-forest);text-decoration:none;transition:background .15s var(--ease)}
.nav:hover{background:var(--forest-2)}
.nav.on{background:var(--lime);color:var(--forest);font-weight:600}
.nav svg{flex:none}
.nav .code{margin-left:auto;font-size:12px;color:var(--on-forest-2)}
.nav.on .code{color:var(--forest)}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-top:1px solid #2c5649}
.me small{display:block;color:var(--on-forest-2);font-size:12px}
main{padding:30px 44px 64px;min-width:0;max-width:1400px}
@media (max-width:980px){.app{grid-template-columns:1fr}.rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.navgroup{flex-direction:row;flex-wrap:wrap}.navgroup h4{display:none}.me{margin:0;border:0}main{padding:24px 16px 48px}}

/* Типографика */
.crumbs{font-size:13px;color:var(--ink-3);margin-bottom:10px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{text-decoration:none;color:var(--ink-2)}
.crumbs a:hover{color:var(--forest);text-decoration:underline}
.crumbs span[aria-hidden]{color:var(--line-strong)}
.h-hero{font-family:var(--display);font-weight:600;font-size:clamp(34px,4.2vw,56px);line-height:1.04;letter-spacing:-.025em;margin:0;text-wrap:balance}
.h-hero .soft{display:block;color:var(--ink-2);font-family:var(--ui);font-weight:500;font-size:.46em;line-height:1.2;letter-spacing:-.01em;margin-top:14px}
.h1{font-family:var(--display);font-weight:600;font-size:clamp(26px,2.6vw,36px);line-height:1.1;letter-spacing:-.02em;margin:0;text-wrap:balance}
.h2{font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:-.01em;margin:0}
.h3{font-size:15px;font-weight:600;margin:0}
.meta{display:flex;flex-wrap:wrap;gap:0;color:var(--ink-2);font-size:13.5px;margin-top:10px}
.meta span{padding:0 12px;border-left:1px solid var(--line-strong)}
.meta span:first-child{padding-left:0;border-left:0}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}

/* Элементы */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);background:var(--paper);border-radius:var(--r-s);padding:8px 14px;font-weight:500;color:var(--forest);transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:hover{border-color:var(--forest)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--forest);font-weight:600}
.btn.primary:hover{background:#c9ea60;border-color:#c9ea60}
.btn.dark{background:var(--forest);border-color:var(--forest);color:var(--milk)}
.btn.dark:hover{background:var(--forest-2)}
.btn.danger{color:var(--err);border-color:#dcb1a9}
.btn.danger:hover{border-color:var(--err);background:var(--err-soft)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--mist)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.done{background:var(--forest);border-color:var(--forest);color:var(--lime)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;white-space:nowrap;padding:2px 9px 2px 7px;border-radius:999px;background:var(--mist);color:var(--ink-2)}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.st.s-new{color:var(--ink-3)}
.st.s-work{background:#E3EADF;color:var(--forest)}
.st.s-review{background:var(--warn-soft);color:var(--warn)}
.st.s-client{background:#E8EFD0;color:#4B5E12}

<script>
// ---------- Иконки ----------
const I={
  home:'<path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

  cal:'<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  up:'<path d="M12 16V4M7 9l5-5 5 5M5 20h14"/>',
  down:'<path d="M12 4v12M7 11l5 5 5-5M5 20h14"/>',
  check:'<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  play:'<path d="M8 5.5v13l11-6.5z"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  send:'<path d="M4 12 20 4l-6 16-3-7z"/>',
  file:'<path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/>'
};
const ic=(n,s=16,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;

// ---------- Превью креативов (иллюстрации макетов клиентов) ----------
function art(task,no,w=320){
  const h=Math.round(w*0.625);const k=no||1;
  const s=(inner,bg)=>`<div class="art"><svg viewBox="0 0 320 200" role="img" aria-label="Превью: ${esc(S.tasks[task]?.title||'')} v${k}"><rect width="320" height="200" fill="${bg}"/>${inner}</svg></div>`;

  if(screenState==='error')return `<div class="empty err"><b>Не удалось загрузить данные</b><p>Сервер не ответил за 10 секунд. Введённые данные не потеряны. Если ошибка повторится, сообщите в поддержку номер запроса req_7f3c2a91.</p><button class="btn dark" onclick="document.getElementById('stateSel').value='data';screenState='data';render()">Повторить</button></div>`;

}

function screen(){

function nextAction(){
  const r=v=>roleIn(S.tasks[v.task].project);
  const vs=Object.values(S.versions).filter(v=>visibleProjects().some(p=>p.id===S.tasks[v.task].project));
  let v=vs.find(v=>v.review==='internal_approved'&&r(v)==='manager');
  if(v)return {v,what:'Опубликовать клиенту',why:`Арт-директор одобрил версию ${v.no}. Клиент её ещё не видел.`};
  v=vs.find(v=>v.review==='internal_review'&&r(v)==='art_director');
  if(v)return {v,what:'Принять решение по версии',why:`Версия ${v.no} ждёт внутреннего согласования.`};
  v=vs.find(v=>v.review==='changes_requested'&&S.tasks[v.task].assignee===me&&S.tasks[v.task].status==='rework');
  if(v)return {v,what:'Загрузить исправленную версию',why:'Правки получены, задача на доработке.'};

function setTask(id,s,msg){const t=S.tasks[id];t.status=s;toast(msg);render()}
function cancelTask(id){const t=S.tasks[id];t.status='cancelled';Object.values(S.versions).filter(v=>v.task===id).forEach(v=>(S.stages[v.id]||[]).forEach(s=>{if(['active','pending'].includes(s.status))s.status='cancelled'}));toast('Задача отменена с причиной «Клиент отказался от формата». Активные этапы отменены');render()}
function uploadBox(u){
  const pct=Math.round(u.done/u.parts*100);
  return `<div class="drop" id="upbox" style="margin-bottom:14px"><div class="row between"><div><b>${esc(u.file)}</b> <span class="muted">1,42 ГБ, ${u.parts} частей по 16 МБ</span></div>
   ${u.paused?`<span class="st s-review">Связь потеряна, повтор части ${u.done+1}, попытка ${u.attempt} из 5</span>`:u.done>=u.parts?'<span class="st s-ok">Регистрируем версию…</span>':'<span class="st s-work">Загрузка</span>'}</div>
   <div class="prog ${u.paused?'paused':''}"><i style="width:${pct}%"></i></div>
   <div class="row between"><span class="num" id="uptext">${pct}% · часть ${u.done} из ${u.parts}</span>
   <div class="row">${u.paused?`<button class="btn sm primary" onclick="resumeUpload()">Связь восстановлена</button>`:`<button class="btn sm" onclick="dropUpload()">Имитировать обрыв связи</button>`}</div></div>
   <label class="check" for="upSubmit"><input id="upSubmit" type="checkbox" ${u.submit?'checked':''} onchange="upload.submit=this.checked">Сразу отправить на внутреннее согласование</label>
   <p class="muted small" style="margin:0">Файл уходит частями прямо в хранилище. После обрыва повторяется только незагруженная часть.</p></div>`;
}
function startUpload(task){const t=S.tasks[task];const lvf=lastVer(task);upload={task,file:lvf?lvf.file.replace(/_v\d+\./,'_v'+(t.last+1)+'.'):'file_v1.pdf',parts:89,done:0,paused:false,attempt:1,submit:true};tickUpload();render()}
function tickUpload(){clearInterval(tickUpload.i);tickUpload.i=setInterval(()=>{if(!upload||upload.paused)return;upload.done=Math.min(upload.parts,upload.done+3);if(upload.done>=upload.parts){clearInterval(tickUpload.i);setTimeout(registerVersion,500)}const pr=document.querySelector('#upbox .prog i'),tx=document.getElementById('uptext');if(pr){pr.style.width=Math.round(upload.done/upload.parts*100)+'%';tx.textContent=Math.round(upload.done/upload.parts*100)+'% · часть '+upload.done+' из '+upload.parts}},120)}
function dropUpload(){upload.paused=true;upload.attempt=2;render()}
function resumeUpload(){upload.paused=false;upload.attempt=1;toast('Загрузка продолжена с части '+(upload.done+1)+'. Загруженные части повторно не передаются');tickUpload();render()}
function registerVersion(){
  if(!upload)return;const u=upload;upload=null;const t=S.tasks[u.task];
  const no=t.last+1;t.last=no;const id='v'+(++S.seq.ver);let replaced=null;
  Object.values(S.versions).filter(v=>v.task===t.id&&['draft','internal_review','internal_approved','client_review'].includes(v.review)).forEach(v=>{v.review='superseded';replaced=v.no;(S.stages[v.id]||[]).forEach(s=>{if(['active','pending'].includes(s.status))s.status='cancelled'})});
  S.versions[id]={id,task:t.id,no,file:u.file,size:'1,42 ГБ',by:me,at:'сегодня',note:'Исправления по комментариям',review:u.submit?'internal_review':'draft',proc:'processing',pub:null};
  S.stages[id]=u.submit?(t.needClient?[{order:1,type:'internal',status:'active'},{order:2,type:'client',status:'pending'}]:[{order:1,type:'internal',status:'active'}]):[];
  t.status=u.submit?'in_review':'in_progress';flashId=id;
  toast(`Версия ${no} загружена${replaced?`, версия ${replaced} заменена и снята с согласования`:''}${u.submit?'. Арт-директор получит письмо':''}`);
  setTimeout(()=>{S.versions[id].proc='ready';if(['task','version'].includes(route.name))render()},2500);
  render();
}
function submitReview(vid){const v=S.versions[vid],t=S.tasks[v.task];v.review='internal_review';S.stages[vid]=t.needClient?[{order:1,type:'internal',status:'active'},{order:2,type:'client',status:'pending'}]:[{order:1,type:'internal',status:'active'}];t.status='in_review';toast('Версия отправлена на внутреннее согласование');render()}
function startTimer(task){timer={task,min:0};timer.i=setInterval(()=>{timer.min+=5;const b=document.getElementById('timerBtn');if(b)b.lastChild.textContent='Остановить таймер · '+timer.min+' мин'},1000);render();toast('Таймер запущен. В демо одна секунда равна пяти минутам')}
function stopTimer(){clearInterval(timer.i);const m=Math.max(5,timer.min);const id=++S.seq.time;S.time.push({id,user:me,task:timer.task,date:'11.10',min:m,bill:true,desc:'Работа по таймеру',status:'draft'});flashId='te'+id;timer=null;toast('Запись времени добавлена: '+hm(m));render()}
function addTime(task){const m=+$('#teMin').value;if(!(m>=1&&m<=1440)){toast('Укажите от 1 до 1440 минут',true);return}const id=++S.seq.time;S.time.push({id,user:me,task,date:'11.10',min:m,bill:$('#teBill').checked,desc:$('#teDesc').value||'Работа',status:'draft'});flashId='te'+id;toast('Запись добавлена как черновик');render()}
function submitMine(task){S.time.filter(e=>e.task===task&&e.user===me&&e.status==='draft').forEach(e=>e.status='submitted');toast('Записи отправлены менеджеру');render()}

  return `${head}
  <div class="row between" style="align-items:flex-end;margin-bottom:18px"><div><div class="row" style="margin-bottom:8px">${status}${v.proc!=='ready'?st(PROC,v.proc):''}</div><h1 class="h1">${esc(t.title)} <span class="muted" style="font-weight:500">v${v.no}</span></h1>

let draftPin=null, decisionOpen=null;
function hot(id,stick){hotComment=id;document.querySelectorAll('[data-c]').forEach(el=>el.classList.toggle('hot',id!=null&&el.dataset.c==String(id)));if(id==null)return;if(stick){const el=document.querySelector('.cm.hot');el&&el.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'})}}
function placePin(e,id,clientView){const v=S.versions[id];if(v.review==='superseded'||v.proc!=='ready')return;const r=e.currentTarget.getBoundingClientRect();draftPin={v:id,x:Math.round((e.clientX-r.left)/r.width*100),y:Math.round((e.clientY-r.top)/r.height*100)};render();const ta=$('#cText');ta&&ta.focus()}
function openDecision(id,cv){decisionOpen={v:id};render();setTimeout(()=>$('#dComment')?.focus(),0)}
function decide(id,decision,clientView){
  const v=S.versions[id],t=S.tasks[v.task],stg=S.stages[id],stage=stg.find(s=>s.status==='active');
  const c=($('#dComment')?.value||'').trim();
  if(decision==='changes_requested'&&c.length<10){toast('Опишите, что нужно исправить: не меньше 10 символов',true);return}
  if(!stage){toast('Решение уже принято другим участником',true);return}
  stage.status=decision;stage.by=me;stage.at='сегодня';if(c)stage.comment=c;decisionOpen=null;
  if(decision==='changes_requested'){stg.forEach(s=>{if(s.status==='pending')s.status='cancelled'});v.review='changes_requested';t.status='rework';toast('Версия возвращена на доработку. Исполнитель получит письмо')}
  else if(stage.type==='internal'&&t.needClient){v.review='internal_approved';toast('Одобрено. Менеджер может опубликовать версию клиенту')}
  else{v.review='approved';t.status='approved';t.approvedAt='сегодня';toast('Версия утверждена. Задача переведена в «Утверждена»')}
  render();
}
function publish(id){const v=S.versions[id];v.review='client_review';v.pub='сегодня';S.stages[id].find(s=>s.type==='client').status='active';toast('Опубликовано клиенту. Представители клиента получат письмо');render()}
function addComment(id,clientView){

function newCR(pid){const p=S.projects[pid];const no=++S.seq.cr;const cr={id:'cr'+no,project:pid,no,title:'',status:'draft',hours:null,cost:null,days:null,newDue:'',newBudget:null,before:p.brief,after:p.brief,base:p.briefVersion,source:'Просьба клиента',desc:'',note:''};S.crs.push(cr);go({name:'cr',id:cr.id})}
function diffWords(a,b){
  const A=a.split(/(\s+)/),B=b.split(/(\s+)/);const m=A.length,n=B.length,L=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  let i=0,j=0,out='';while(i<m&&j<n){if(A[i]===B[j]){out+=esc(A[i]);i++;j++}else if(L[i+1][j]>=L[i][j+1]){out+=`<del>${esc(A[i])}</del>`;i++}else{out+=`<ins>${esc(B[j])}</ins>`;j++}}
  while(i<m)out+=`<del>${esc(A[i++])}</del>`;while(j<n)out+=`<ins>${esc(B[j++])}</ins>`;return out.replace(/\n/g,'<br>');
}

  ${stale&&!clientView?`<div class="note warn row between" style="margin-bottom:16px"><span>Запрос устарел: после его создания принят другой запрос, ТЗ уже версии ${p.briefVersion}. Решение клиента будет отклонено.</span>${isMgr?`<button class="btn sm" onclick="crRebase('${id}')">Вернуть в черновик и обновить</button>`:''}</div>`:''}
  ${wrap('cr',`<div style="display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:26px;align-items:start">
   <section>${editable?`<div class="field"><label for="f_title">Заголовок</label><input id="f_title" value="${esc(c.title)}" placeholder="Например: вертикальная версия ролика" onchange="crSet('${id}','title',this.value,'text')"></div>
     <div class="field"><label for="f_desc">Что и почему меняется</label><textarea id="f_desc" onchange="crSet('${id}','desc',this.value,'text')">${esc(c.desc||'')}</textarea></div>
     <div class="field"><label for="f_after">Новая редакция ТЗ</label><textarea id="f_after" style="min-height:120px" oninput="crSet('${id}','after',this.value,'text',true)">${esc(c.after)}</textarea></div>`:`<h2 class="h2" style="font-size:22px;margin-bottom:8px">${esc(c.title)}</h2><p style="font-size:15px;line-height:1.6;max-width:62ch;margin:0 0 18px">${esc(c.desc||'')}</p>`}
     <h3 class="h3" style="margin-bottom:8px">Что изменится в тексте ТЗ</h3><div class="diff" id="diffBox">${diffWords(c.before,c.after)}</div>
     <p class="muted small" style="margin-top:8px"><ins style="background:#E5F3B5;text-decoration:none;padding:0 3px">добавлено</ins> &nbsp; <del style="background:var(--err-soft);color:var(--err);padding:0 3px">удалено</del></p>
   </section>
   <section class="impact"><h2 class="h2" style="color:var(--milk)">Влияние на проект</h2>
     ${editable?`<div style="margin-top:14px">${f('hours','Дополнительные часы')}${f('cost','Стоимость, ₽')}<p class="small" style="margin:-6px 0 12px;color:var(--on-forest-2)">Часы × ставка ${rub(p.rate)} = ${c.hours?rub(c.hours*p.rate):'—'}</p>${f('days','Сдвиг срока, рабочих дней')}${f('newDue','Новая дата сдачи','text')}${f('newBudget','Новый бюджет, ₽')}
       <div class="field"><label for="f_note">Внутренняя заметка, клиент её не видит</label><textarea id="f_note" onchange="crSet('${id}','note',this.value,'text')">${esc(c.note||'')}</textarea></div></div>`:

     </div>

function crSet(id,k,val,type,live){const c=S.crs.find(x=>x.id===id);c[k]=type==='number'?(val===''?null:+val):val;if(live){$('#diffBox').innerHTML=diffWords(c.before,c.after)}else render()}
function crAssess(id){const c=S.crs.find(x=>x.id===id);const names={title:'заголовок',hours:'часы',cost:'стоимость',days:'сдвиг срока',newDue:'новая дата',newBudget:'новый бюджет'};const miss=Object.keys(names).filter(k=>c[k]==null||c[k]==='');if(miss.length){toast('Заполните: '+miss.map(k=>names[k]).join(', '),true);return}c.status='assessed';toast('Оценка сохранена');render()}
function crSend(id){S.crs.find(x=>x.id===id).status='sent_to_client';toast('Запрос отправлен клиенту');render()}
function crWithdraw(id){S.crs.find(x=>x.id===id).status='draft';toast('Запрос отозван в черновик');render()}
function crRebase(id){const c=S.crs.find(x=>x.id===id),p=S.projects[c.project];c.before=p.brief;c.base=p.briefVersion;c.status='draft';toast('Запрос перенесён на текущую версию ТЗ. Проверьте текст и оценку');render()}
function crOffline(id){applyCR(S.crs.find(x=>x.id===id),'dmitry','вне системы','письмо клиента от 12.10.2026')}
function crDecide(id,d){
  const c=S.crs.find(x=>x.id===id),p=S.projects[c.project];const com=($('#crComment')?.value||'').trim();
  if(d==='rejected'){if(!com){toast('Укажите причину отклонения',true);return}Object.assign(c,{status:'rejected',decidedBy:me,decidedAt:'сегодня',channel:'портал',comment:com});toast('Запрос отклонён. ТЗ не изменилось');render();return}
  if(c.base!==p.briefVersion){toast('Запрос устарел, агентство обновит его',true);return}
  applyCR(c,me,'портал','');
}
function applyCR(c,by,channel,com){
  const p=S.projects[c.project];if(c.base!==p.briefVersion){toast('Базовая версия ТЗ устарела',true);return}
  Object.assign(c,{status:'approved',decidedBy:by,decidedAt:'сегодня',channel,comment:com,recent:true});
  p.brief=c.after;p.briefVersion+=1;p.due=c.newDue;p.budget=c.newBudget;
  toast(`Запрос принят. ТЗ версии ${p.briefVersion}, срок ${p.due}, бюджет ${rub(p.budget)}`);render();
}

   ${entries.map(e=>{const t=S.tasks[e.task],p=S.projects[t.project];return `<tr class="${selTime.has(e.id)?'sel':''} ${flashId==='te'+e.id?'flash':''}"><td>${e.status==='submitted'?`<label class="check" for="te${e.id}"><input type="checkbox" id="te${e.id}" aria-label="Выбрать запись ${e.id}" ${selTime.has(e.id)?'checked':''} onchange="this.checked?selTime.add(${e.id}):selTime.delete(${e.id});render()"></label>`:e.status==='approved'?`<span title="Запись защищена от изменения" class="muted">${ic('lock',14)}</span>`:''}</td>
   <td><div class="row" style="gap:10px;flex-wrap:nowrap;align-items:flex-start">${av(e.user,26)}<div>${esc(e.desc)}<div class="muted small"><span class="num">${e.date}</span> · ${esc(U(e.user))}</div>${e.corr?`<div class="muted small">корректирует запись №${e.corr}: ${esc(e.reason)}</div>`:''}</div></div></td>
   <td>${esc(S.clients[p.client].name.split(',')[0])}<div class="muted small">${p.code} · ${esc(t.title)}</div></td>

function approveSel(){S.time.filter(e=>selTime.has(e.id)).forEach(e=>{e.status='approved';e.rate=S.projects[S.tasks[e.task].project].rate;flashId='te'+e.id});toast(`Утверждено записей: ${selTime.size}. Ставка зафиксирована, записи защищены`);selTime.clear();render()}
function rejectSel(){S.time.filter(e=>selTime.has(e.id)).forEach(e=>e.status='rejected');toast('Записи отклонены с комментарием «Уточните описание работы»');selTime.clear();render()}
function correction(id){const e=S.time.find(x=>x.id===id);const nid=++S.seq.time;S.time.push({id:nid,user:e.user,task:e.task,date:'11.10',min:-60,bill:e.bill,desc:'Корректировка',status:'submitted',corr:id,reason:'час планёрки ошибочно учтён как монтаж'});flashId='te'+nid;toast('Создана корректирующая запись −1 ч. Исходная запись не изменена');render()}
function exportCSV(){
  const rows=S.time.filter(e=>e.status==='approved'&&e.bill&&!e.batch);
  if(!rows.length){csvText='Новых записей для выгрузки нет. Повторная выгрузка пакета будет помечена как повторная.';render();return}
  const b='B-2026-'+(++S.seq.batch);rows.forEach(e=>e.batch=b);
  csvText='пакет;клиент;проект;задача;часы;ставка;сумма\n'+rows.map(e=>{const t=S.tasks[e.task],p=S.projects[t.project];return [b,S.clients[p.client].name,p.code,t.title,(e.min/60).toFixed(2).replace('.',','),e.rate,Math.round(e.min/60*e.rate)].join(';')}).join('\n');
  toast('Пакет '+b+' сформирован. В демо файл не скачивается, содержимое показано ниже');render();
}
